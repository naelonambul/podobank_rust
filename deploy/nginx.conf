# 브라우저는 이 주소 하나만 부른다. 화면(정적 파일)과 API가 같은 주소라 쿠키가 그대로 붙고 CORS가 필요 없다.
server {
    listen 80;
    server_name _;

    # vm/nginx.sh reuses these routes in the optional 443 ssl server block.
    client_max_body_size 1m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 백엔드 문서도 같은 nginx 주소에서 확인한다.
    location = /docs {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /redoc {
        proxy_pass http://127.0.0.1:8000;
    }

    # API: /api/ 로 시작하면 HAProxy로 넘긴다. HAProxy가 FastAPI 2대에 나눠 보낸다.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;  # HAProxy (같은 서버의 8000번)
        proxy_read_timeout 15s;
    }

    # 화면: 프론트 빌드 결과(dist)를 그대로 준다. 없는 경로는 index.html(화면 라우터가 처리).
    location / {
        root /usr/share/nginx/html;  # 프론트 빌드 결과를 둔 폴더
        try_files $uri $uri/ /index.html;
    }
}
