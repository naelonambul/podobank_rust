# 로드밸런서: Nginx가 넘긴 /api 요청을 FastAPI 2대에 번갈아 보낸다.
global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    option httplog
    mode http
    timeout connect 3s
    timeout client 20s
    timeout server 15s
    retries 1
    # 연결이 안 되는 서버로 간 요청은 다른 서버로 한 번 다시 보낸다(죽은 걸 알아채기 전 몇 초 동안).
    option redispatch

frontend api_in
    bind :8000
    default_backend fastapi

backend fastapi
    balance roundrobin
    # 실제 응답을 처리한 서버를 배포 검증에서 확인한다.
    http-response set-header X-Backend-Server %[srv_name]
    # 2초마다 상태를 물어보고, 2번 연속 실패하면 빼고, 2번 연속 성공하면 다시 넣는다.
    option httpchk GET /api/v1/health
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    # 한 대(노트북 한 대)에 둘 다 띄울 때. FastAPI를 다른 서버에 두면 그 서버의 사설 IP:포트로 바꾼다.
    server api-1 127.0.0.1:8001 check
    server api-2 127.0.0.1:8002 check
