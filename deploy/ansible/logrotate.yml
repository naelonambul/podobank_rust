---
# 기존 API VM에는 이 플레이북으로 로그 교체 설정만 적용한다.
- name: Configure hourly log rotation on API VMs
  hosts: api
  become: true
  gather_facts: false
  tasks:
    - name: Create the installer directory
      ansible.builtin.file:
        path: /opt/podobank-installer/deploy/vm
        state: directory
        mode: '0755'
    - name: Copy log rotation installer and configuration
      ansible.builtin.copy:
        src: "../vm/{{ item }}"
        dest: "/opt/podobank-installer/deploy/vm/{{ item }}"
        mode: '0644'
      loop:
        - common.sh
        - logrotate.sh
        - podobank-logrotate.conf
        - podobank-logrotate.service
        - podobank-logrotate.timer
    - name: Apply log rotation without restarting the API
      ansible.builtin.command:
        argv:
          - bash
          - /opt/podobank-installer/deploy/vm/logrotate.sh
    - name: Verify the timer is enabled
      ansible.builtin.command: systemctl is-enabled podobank-logrotate.timer
      changed_when: false
    - name: Verify the timer is running
      ansible.builtin.command: systemctl is-active podobank-logrotate.timer
      changed_when: false
