---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create signing key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Install official Grafana signing key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
- name: Configure official Grafana package repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main
    filename: grafana
    state: present
