---
# Source and artifacts are read from the Ansible controller's workspace, never Git.
- name: Inspect the controller frontend package
  ansible.builtin.stat:
    path: '{{ frontend_source_dir }}/package.json'
  delegate_to: localhost
  become: false
  run_once: true
  register: frontend_package
  when: frontend_build | bool

- name: Require frontend source before building
  ansible.builtin.assert:
    that: frontend_package.stat.exists
    fail_msg: 'frontend/package.json is missing in the controller workspace. Supply frontend_source_dir, or use frontend_build=false with an existing frontend_dist_dir.'
  when: frontend_build | bool

- name: Install locked frontend dependencies in the controller workspace
  ansible.builtin.command:
    argv: [npm, ci]
    chdir: '{{ frontend_source_dir }}'
  delegate_to: localhost
  become: false
  run_once: true
  when: frontend_build | bool

- name: Build the current workspace frontend
  ansible.builtin.command:
    argv: [npm, run, build]
    chdir: '{{ frontend_source_dir }}'
  delegate_to: localhost
  become: false
  run_once: true
  when: frontend_build | bool

- name: Inspect the built frontend entry point
  ansible.builtin.stat:
    path: '{{ frontend_dist_dir }}/index.html'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  run_once: true
  register: frontend_index

- name: Require a real build before replacing the deployed page
  ansible.builtin.assert:
    that:
      - frontend_index.stat.exists
      - frontend_index.stat.isreg | default(false)
    fail_msg: 'No index.html in frontend_dist_dir. Build the frontend before deployment.'

- name: Copy compiled frontend files into the nginx document root
  ansible.builtin.copy:
    src: '{{ frontend_dist_dir }}/'
    dest: /var/www/podobank/
    owner: root
    group: root
    mode: u=rwX,go=rX

- name: Inspect the deployed frontend entry point
  ansible.builtin.stat:
    path: /var/www/podobank/index.html
    checksum_algorithm: sha256
  register: deployed_frontend_index

- name: Verify the controller build was deployed exactly
  ansible.builtin.assert:
    that: deployed_frontend_index.stat.checksum == frontend_index.stat.checksum

- name: Verify nginx serves the frontend for browser routes
  ansible.builtin.uri:
    url: http://127.0.0.1/login
    status_code: 200
    return_content: true
  register: frontend_http

- name: Require nginx to return the exact deployed frontend HTML
  ansible.builtin.assert:
    that: (frontend_http.content | hash('sha256')) == frontend_index.stat.checksum
