# 기본 logrotate 작업과 중복 실행되지 않도록 /etc/logrotate.d 밖에 설치한다.
/var/log/podobank/api-*.app.log /var/log/podobank/api-*.events.log {
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    nocopytruncate
    create 0640 podobank podobank
    su podobank podobank
}
